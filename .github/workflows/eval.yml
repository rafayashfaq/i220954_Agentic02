name: Smoke Eval Gate

on: [pull_request, workflow_dispatch]

jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mcp langchain-mcp-adapters scikit-learn langgraph-checkpoint-sqlite aiosqlite
      - name: Generate Seed Data if needed
        run: python data/generate_dataset.py
      - name: Run CI Evaluation Quality Gate
        run: python evals/runners/ci_eval.py
