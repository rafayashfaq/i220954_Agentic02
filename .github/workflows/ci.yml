name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mcp langchain-mcp-adapters scikit-learn langgraph-checkpoint-sqlite aiosqlite reportlab pypdf

      - name: Lint with ruff
        run: ruff check .
      - name: Unit & MCP Contract Tests
        run: pytest tests/ mcp_servers/ -v
      - name: Setup Node for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright & Test UI
        working-directory: ./apps/web
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
