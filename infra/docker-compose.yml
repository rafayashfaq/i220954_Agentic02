version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - ../.env.example
    environment:
      - DATABASE_URL=postgresql://gigbid:gigbid@postgres:5432/gigbid
      - REDIS_URL=redis://redis:6379/0
      - GIGSIM_URL=http://gigsim:8001
      - GIGSIM_IN_PROCESS=false
    depends_on:
      - postgres
      - redis
      - gigsim

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    env_file:
      - ../.env.example
    environment:
      - DATABASE_URL=postgresql://gigbid:gigbid@postgres:5432/gigbid
      - REDIS_URL=redis://redis:6379/0
      - GIGSIM_URL=http://gigsim:8001
      - GIGSIM_IN_PROCESS=false
    depends_on:
      - api
      - redis

  gigsim:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.gigsim
    ports:
      - "8001:8001"
    environment:
      - PORT=8001

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: gigbid
      POSTGRES_PASSWORD: gigbid
      POSTGRES_DB: gigbid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigbid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  postgres_data:
  ollama_models:
